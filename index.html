<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Figurine Creator — Personnalise ta figurine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <h1>Personnalise ta figurine !</h1>
  </header>

  <main class="contenu-principal">
    <section class="carte-figurine" aria-label="Aperçu et choix de la figurine">

      <div class="apercu-figurine">
        <img src="image/craotor-basique.png" alt="Aperçu de la figurine en cours de personnalisation">
      </div>

      <nav class="choix-categories" aria-label="Catégories à personnaliser">
        <a href="cheveux.html" class="bouton-categorie bouton-categorie--vert">Cheveux</a>
        <a href="tete.html" class="bouton-categorie bouton-categorie--rouge">Tête</a>
        <a href="torse.html" class="bouton-categorie bouton-categorie--jaune">Torse</a>
        <a href="jambes.html" class="bouton-categorie bouton-categorie--orange">Jambes</a>
      </nav>

    </section>

    <div class="ligne-actions">
      <button type="button" class="bouton bouton--alea">🎲 Aléatoire</button>
      <button type="button" class="bouton bouton--prix">
        <span class="prix-label">Prix</span>
        <span class="prix-valeur">0.95 CHF</span>
      </button>
    </div>

    <button type="button" class="bouton bouton--reset">Réinitialiser</button>

    <form id="enregistrer" class="formulaire">
      <h2>Enregistre ton personnage</h2>
      <label for="champ-prenom">Prénom de ton personnage</label>
      <input type="text" id="champ-prenom" name="prenom" class="champ" autocomplete="off">
      <p id="erreurs" aria-live="polite"></p>
      <button type="submit" class="bouton bouton--valider">Enregistrer ✓</button>
      <p id="confirmation" role="status"></p>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
